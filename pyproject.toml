[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcp-autocut"
version = "0.1.0"
description = "Prototype du moteur de détection des silences pour FCP AutoCut"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fcp-autocut = "fcp_autocut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
